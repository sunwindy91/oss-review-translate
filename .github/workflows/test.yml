name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: unit (flags)
        run: python tests/test_flags.py
      - name: end-to-end (offline replay)
        run: python tests/test_all.py
